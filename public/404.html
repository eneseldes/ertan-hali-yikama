<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 404 sayfasının kendisi aramada çıkmasın. -->
    <meta name="robots" content="noindex, follow" />
    <title>Ertan Halı Yıkama — Niğde Halı Yıkama ve Koltuk Temizliği</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1e5fa8" />

    <!--
      GitHub Pages, eşleşmeyen her adres için bu dosyayı servis eder.
      Ziyaretçiyi anında ana sayfaya alıyoruz; böylece GitHub'ın varsayılan
      "There isn't a GitHub Pages site here" ekranı hiçbir şekilde görünmez.
      Sonsuz döngü koruması: zaten kökteysek yönlendirme yapma.
    -->
    <script>
      (function () {
        if (window.location.pathname !== '/') {
          window.location.replace('/')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #1e5fa8 0%, #144480 100%);
        color: #fff;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card { max-width: 520px; }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 32px;
      }
      .logo span {
        display: grid;
        place-items: center;
        width: 34px; height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 13px;
      }
      h1 {
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        font-size: clamp(26px, 5vw, 36px);
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 14px;
      }
      p { font-size: 16px; line-height: 1.65; color: rgba(255, 255, 255, 0.85); }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 30px;
      }
      a.btn {
        display: inline-block;
        padding: 13px 26px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a.btn:hover { transform: translateY(-2px); opacity: 0.92; }
      .btn-solid { background: #fff; color: #1e5fa8; }
      .btn-green { background: #25d366; color: #fff; }
      .btn-ghost {
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
      }
      .note { margin-top: 26px; font-size: 13.5px; color: rgba(255, 255, 255, 0.65); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><span>EH</span> Ertan Halı Yıkama</div>

      <h1>Aradığınız sayfa taşınmış olabilir</h1>
      <p>
        Sizi ana sayfaya yönlendiriyoruz. Yönlendirme başlamazsa aşağıdaki
        bağlantıyı kullanabilir ya da doğrudan bize ulaşabilirsiniz.
      </p>

      <div class="actions">
        <a class="btn btn-solid" href="/">Ana Sayfaya Dön</a>
        <a class="btn btn-green" href="https://wa.me/905515630351">WhatsApp'tan Yaz</a>
        <a class="btn btn-ghost" href="tel:+905515630351">0551 563 03 51</a>
      </div>

      <p class="note">Niğde Merkez, Bor ve Çiftlik bölgelerine hizmet veriyoruz.</p>
    </div>
  </body>
</html>
